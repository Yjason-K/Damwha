[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "damwha-worker"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "psycopg[binary]>=3.1",
]

# Real ML models — heavy + gated (pyannote). NOT needed for the deterministic
# test suite (registry/adapters are imported only inside main()). Install for
# the real worker with: `uv sync --extra models`. Platform markers pick the STT
# backend: mlx-whisper on Apple Silicon, faster-whisper elsewhere.
[project.optional-dependencies]
models = [
    "torch>=2.2",
    "torchaudio>=2.2",
    "silero-vad>=5.1",
    "pyannote.audio>=3.1",
    "speechbrain>=1.0",
    "soundfile>=0.12",
    "numpy>=1.26",
    "mlx-whisper>=0.4 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "faster-whisper>=1.0 ; sys_platform != 'darwin' or platform_machine != 'arm64'",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "testcontainers[postgres]>=4.0",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
