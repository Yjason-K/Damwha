# Phase 1은 서명 없는 .app까지만 만든다. dmg·서명·공증은 Phase 6 (스펙 §4.2).
appId: kr.damwha.app
productName: Damwha
directories:
  output: out
  buildResources: build-resources
# asar 안에는 컴파일된 main과 셸 화면만 들어간다. desktop에는 dependencies가 없으므로
# electron-builder가 훑을 prod 의존성이 없다 (스펙 P1-C11).
files:
  - dist/**/*
  - shell/**/*
  - package.json
# API 트리는 pnpm deploy 산출물을 통째로 복사한다. electron-builder는 내용을 해석하지 않는다.
# from은 build/api가 아니라 build다 (실측으로 확정) — app-builder-lib의 파일 필터가
# `from` 바로 아래 자식이 정확히 "node_modules"면 그 디렉터리를 통째로 건너뛴다
# (asar로 패키징되는 메인 앱 자신의 의존성만 염두에 둔 하드코딩이라, extraResources에도
# 무차별 적용된다). build/에는 이제 api/·postgres/·python/·ffmpeg/ 넷이 있고, 한 단계 위에서
# 복사하면 "api/node_modules"가 되어 그 규칙을 피하면서도 결과는 똑같이 Resources/<이름> 넷이다.
extraResources:
  - from: build
mac:
  target: dir
  # electron-builder가 스스로 서명하지 않게 한다. 서명은 scripts/package.mjs가 electron-builder
  # 뒤에 ad-hoc(`--sign -`)으로 한다 — 그 스크립트의 주석이 "서명 설정 없음이면 재서명하지 않는다"를
  # 전제한다. 그런데 설정이 비어 있으면 electron-builder는 키체인에서 신원을 **자동으로 찾는다**:
  # 2026-09-13 이 맥의 키체인에 이름이 같은 "Apple Development" 인증서가 둘 생기자 그것을 집어
  # codesign이 `ambiguous`로 실패했다(Phase 1 때는 iOS 배포 인증서뿐이라 드러나지 않았다).
  # null이 자동 탐색을 끄는 문서화된 값이다. Developer ID 서명·공증은 Phase 6.
  identity: null
  category: public.app-category.productivity
  # buildResources 기준이다. 원본은 icon.svg이고 scripts/build-icon.sh가 이 파일을 만든다.
  icon: icon.icns
  extendInfo:
    # 없으면 macOS가 마이크 요청 시 앱을 죽인다 (스펙 §6.6).
    NSMicrophoneUsageDescription: 담화가 회의를 녹음하려면 마이크를 사용해요. 녹음과 처리는 이 맥 안에서만 일어나요.
    # 번들 Mach-O의 minos 최대값과 **같은 값**이어야 한다 (Phase 6a 스펙 §5.4).
    # scripts/lib/build-target.sh·scripts/lib/minos.mjs의 MAX_MINOS가 같은 값을 든다.
    # 이것만 낮추면 Finder는 실행을 허용하고 dyld가 죽인다.
    LSMinimumSystemVersion: "15.0"
dmg:
  # 마운트한 볼륨의 아이콘 — 앱 아이콘과 같은 파일로 명시한다.
  # 창 배경은 정하지 않았다(Notion P2: 앱 아이콘과 별개로 간다).
  icon: icon.icns
