<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <!-- 스펙 §6.11. 원인 문구에는 서브프로세스 stderr가 들어오므로 글자로만 넣는 것(textContent)이 첫 겹이고
         이것이 둘째 겹이다: 이 파일의 인라인 스크립트·스타일 **하나씩만** 해시로 허용하고, 그 밖의 스크립트
         (주입된 onerror= 같은 인라인 핸들러 포함)·원격 자원·이미지·폼 전송은 전부 막는다. 스크립트나
         스타일을 한 글자라도 고치면 해시를 다시 계산해야 한다 — tests/shell-html.test.ts가 어긋남을 잡는다.
         임베더가 실행하는 스크립트(main의 executeJavaScript)는 script-src를 거치지 않는다고 본다 — headless
         Chrome에서 CDP Runtime.evaluate로 이 정책 아래 렌더를 확인했고, Electron에서의 확인은 packaged 점검 몫이다.

         Phase 4(Task 11)부터 이 창에 버튼이 있다 — 스펙 §6.4의 토큰 설정과 §6.10 2층의 "서비스 다시 시작"이
         둘 다 여기여야 하기 때문이다(Phase 2의 "표시 전용"은 그 전 스펙의 것이다). **그래도 렌더러 → main
         채널은 만들지 않는다**: preload도 IPC도 없고, 버튼은 token.html과 같은 방식으로 main이 거는 next()
         호출의 **반환값**으로만 밖에 나간다. 입력칸은 여전히 없다 — 토큰 입력은 token.html 하나가 맡는다. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-U4ArEBeaumpajpNbevnAM7TWtzqIX2SO33vHWyOVwJ0='; style-src 'sha256-Qma+b2becdVss+Vzq24X2+Mfr/2D1Bad97TtrR478+o='; base-uri 'none'; form-action 'none'" />
    <title>서비스 상태</title>
    <style>
      /* 색·서체는 fe/src/index.css의 토큰을 **같은 이름으로** 옮겨 적는다(셸 페이지는 CSP상 fe의 CSS를
         불러올 수 없다). 값이 어긋나면 tests/windows/shell-html.test.ts가 잡는다 — :root 밖에 색을 직접
         적지 않는다. fe에 다크 모드가 없으므로 라이트로 고정한다(status.html과 같은 이유). */
      :root {
        color-scheme: light;
        --surface-app: #f7f7f7;
        --surface-card: #ffffff;
        --surface-hover: #ededed;
        --text-primary: #0a0a0a;
        --text-secondary: #5a5a5c;
        --text-faint: #a8a8aa;
        --text-on-accent: #ffffff;
        --border-default: #e5e5e5;
        --border-strong: #d4d4d4;
        --accent-solid: #0a0a0a;
        --accent-solid-hover: #1c1c1e;
        --accent-6: #00d4a4;
        --gray-0: #ffffff;
        --gray-2: #f7f7f7;
        --green-9: #2c8a4c;
        --amber-9: #c37d0d;
        --red-9: #c94a4a;
        --radius-sm: 6px;
        --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        --font-mono: "Geist Mono", ui-monospace, "SF Mono", "Menlo", monospace;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; padding: 20px 24px 24px;
        font: 13px/1.55 var(--font-sans);
        background: var(--surface-app); color: var(--text-primary);
        -webkit-font-smoothing: antialiased;
      }
      header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
      h1 { font-size: 15px; font-weight: 600; margin: 0; }
      h2 {
        margin: 20px 0 0; font-size: 11px; font-weight: 600; letter-spacing: 0.04em;
        text-transform: uppercase; color: var(--text-secondary);
      }
      .meta { margin: 0; font-size: 12px; color: var(--text-secondary); }
      #notices { margin: 14px 0 0; padding: 0; list-style: none; }
      #notices li {
        padding: 8px 10px; border: 1px solid var(--border-default); border-radius: var(--radius-sm);
        font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere;
      }
      #notices li + li { margin-top: 6px; }
      #rows, #models { margin: 8px 0 0; padding: 0; list-style: none; border-top: 1px solid var(--border-default); }
      .row { padding: 12px 0; border-bottom: 1px solid var(--border-default); }
      .head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .name { font-weight: 600; }
      .badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; }
      .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-faint); flex: none; }
      .row[data-tone="ok"] .dot { background: var(--green-9); }
      .row[data-tone="warn"] .dot { background: var(--amber-9); }
      .row[data-tone="fail"] .dot { background: var(--red-9); }
      .notes { font-size: 12px; color: var(--text-secondary); }
      button {
        flex: none; font: inherit; font-size: 12px; font-weight: 500; padding: 3px 10px;
        border-radius: var(--radius-sm); border: 1px solid var(--border-default);
        background: var(--surface-card); color: var(--text-primary); cursor: default; outline: none;
      }
      button:hover:not(:disabled) { border-color: var(--border-strong); background: var(--gray-2); }
      button:focus-visible, input:focus-visible { box-shadow: 0 0 0 2px var(--gray-0), 0 0 0 4px var(--accent-6); }
      button:disabled { opacity: 0.45; }
      .act { margin-left: auto; display: inline-flex; gap: 6px; }
      /* 원인은 여러 줄이다(zod 검증 실패, 파이썬 트레이스백). 줄바꿈을 살리되 긴 줄은 접고,
         화면을 다 먹지 않게 높이를 묶는다 — 전문은 로그 파일에 있다. */
      .cause {
        margin: 8px 0 0; padding: 8px 10px; border-radius: var(--radius-sm); background: var(--surface-hover);
        font: 11.5px/1.5 var(--font-mono);
        white-space: pre-wrap; overflow-wrap: anywhere;
        max-height: calc(16lh + 16px); overflow-y: auto;
      }
      .hint { margin: 6px 0 0; font-size: 12px; }
      .warning { margin: 6px 0 0; font-size: 12px; }
      .warning::before { content: ""; display: inline-block; width: 3px; height: 0.9em; margin-right: 6px; background: var(--amber-9); vertical-align: -1px; }
      .command { margin: 6px 0 0; font-size: 12px; }
      .command code { font-family: var(--font-mono); user-select: all; }
      .log { margin: 4px 0 0; font-size: 11.5px; color: var(--text-secondary); overflow-wrap: anywhere; }
      #token { padding: 12px 0; border-top: 1px solid var(--border-default); border-bottom: 1px solid var(--border-default); margin-top: 8px; }
      #token-value { font-family: var(--font-mono); user-select: all; }
      #token-note { margin: 6px 0 0; font-size: 12px; color: var(--text-secondary); }
      .foot { margin: 14px 0 0; font-size: 12px; color: var(--text-secondary); }
    </style>
  </head>
  <body>
    <header>
      <h1>서비스 상태</h1>
      <p class="meta" id="updated">상태를 기다리고 있어요.</p>
    </header>
    <ul id="notices" hidden></ul>
    <ul id="rows"></ul>
    <h2 id="models-title" hidden>모델 준비</h2>
    <ul id="models" hidden></ul>
    <h2>허깅페이스 토큰</h2>
    <div id="token">
      <div class="head">
        <span id="token-value">확인하는 중…</span>
        <span class="act">
          <button type="button" id="token-change">토큰 바꾸기</button>
          <button type="button" id="token-clear">삭제</button>
        </span>
      </div>
      <p id="token-note"></p>
    </div>
    <p class="foot">
      멈춘 서비스는 이 창의 “서비스 다시 시작”이나 메뉴의 서비스 &gt; 다시 시도로 다시 띄울 수 있어요.
    </p>
    <script>
      // main이 executeJavaScript로 부른다 (스펙 §6.11 — main → 렌더러 한 방향). 이 페이지가 main을
      // 부르는 경로는 없다: preload도 IPC도 없고, 버튼이 만든 동작은 main이 건 next()의 **반환값**으로만
      // 나간다 (token.html과 같은 다리).
      //
      // 받는 문자열에는 서브프로세스 stderr가 들어 있다. **전부 textContent로만 넣는다.**
      // HTML로 해석하는 싱크(innerHTML·insertAdjacentHTML·outerHTML·document.write)를 쓰지
      // 않는다 — tests/shell-html.test.ts가 이 파일의 스크립트를 그 싱크가 던지는 DOM에서 돌린다.
      (function () {
        const queue = [];
        const waiters = [];

        function emit(action) {
          const waiter = waiters.shift();
          if (waiter) waiter(action);
          else queue.push(action);
        }

        function el(tag, className, text) {
          const node = document.createElement(tag);
          if (className) node.className = className;
          if (text !== undefined) node.textContent = text;
          return node;
        }

        /** 한 번 누르면 잠근다. 다음 렌더가 main이 정한 모양으로 다시 그린다. */
        function button(label, disabled, action) {
          const b = el("button", "", label);
          b.disabled = disabled === true;
          b.addEventListener("click", function () {
            if (b.disabled) return;
            b.disabled = true;
            emit(action);
          });
          return b;
        }

        function explain(item, r) {
          if (typeof r.cause === "string") item.append(el("pre", "cause", r.cause));
          if (typeof r.hint === "string") item.append(el("p", "hint", "해결: " + r.hint));
          if (typeof r.warning === "string") item.append(el("p", "warning", "주의: " + r.warning));
        }

        /** 버튼과, 비활성일 때 그 까닭. 회색 버튼만 두면 "앱이 멈췄다"로 읽힌다. */
        function restartInto(head, item, restart) {
          if (!restart) return;
          const act = el("span", "act");
          act.append(button(restart.label, restart.disabled, { kind: "restart", service: restart.service }));
          head.append(act);
          if (typeof restart.note === "string") item.append(el("p", "notes", restart.note));
        }

        function row(r) {
          const item = el("li", "row");
          item.dataset.tone = r.tone;
          const head = el("div", "head");
          head.append(el("span", "name", r.name));
          const badge = el("span", "badge");
          badge.append(el("span", "dot"), el("span", "state", r.state));
          head.append(badge);
          if (r.notes.length > 0) head.append(el("span", "notes", r.notes.join(" · ")));
          restartInto(head, item, r.restart);
          item.append(head);
          explain(item, r);
          if (typeof r.command === "string") {
            const p = el("p", "command", "디버깅 접속: ");
            p.append(el("code", "", r.command));
            item.append(p);
          }
          item.append(el("p", "log", "로그: " + r.log));
          return item;
        }

        function model(m) {
          const item = el("li", "row");
          item.dataset.tone = m.tone;
          const head = el("div", "head");
          head.append(el("span", "name", m.key));
          const badge = el("span", "badge");
          badge.append(el("span", "dot"), el("span", "state", m.state));
          head.append(badge);
          if (m.notes.length > 0) head.append(el("span", "notes", m.notes.join(" · ")));
          restartInto(head, item, m.restart);
          item.append(head);
          explain(item, m);
          return item;
        }

        const tokenValue = document.getElementById("token-value");
        const tokenNote = document.getElementById("token-note");
        const tokenChange = document.getElementById("token-change");
        const tokenClear = document.getElementById("token-clear");
        tokenChange.addEventListener("click", function () {
          if (tokenChange.disabled) return;
          tokenChange.disabled = true;
          emit({ kind: "token", op: "change" });
        });
        tokenClear.addEventListener("click", function () {
          if (tokenClear.disabled) return;
          tokenClear.disabled = true;
          emit({ kind: "token", op: "clear" });
        });

        window.__damwha_services = {
          next: function () {
            if (queue.length > 0) return Promise.resolve(queue.shift());
            return new Promise(function (resolve) {
              waiters.push(resolve);
            });
          },
        };

        window.__damwha_render = function (view) {
          const notices = document.getElementById("notices");
          notices.replaceChildren(...view.notices.map((text) => el("li", "", text)));
          notices.hidden = view.notices.length === 0;
          document.getElementById("rows").replaceChildren(...view.rows.map(row));

          const models = view.models || [];
          const list = document.getElementById("models");
          list.replaceChildren(...models.map(model));
          list.hidden = models.length === 0;
          document.getElementById("models-title").hidden = models.length === 0;

          const token = view.token || { masked: null, note: "", canClear: false };
          tokenValue.textContent = token.masked === null ? "없음" : token.masked;
          tokenNote.textContent = token.note;
          // main이 정한 잠금을 그대로 따른다. 여기서 무조건 풀면, 토큰 창이 떠 있는 동안 감독자가
          // 일으킨 다시 그리기가 버튼을 되살려 두 번째 창이 열린다.
          tokenChange.disabled = token.busy === true;
          tokenClear.disabled = token.canClear !== true;
          // 창이 살아 있는지 사람이 알 수 있게 한다 — degraded가 ok로 돌아오기를 기다리는 사람은
          // "안 바뀐 것"과 "안 갱신된 것"을 구분해야 한다.
          document.getElementById("updated").textContent =
            "마지막 갱신 " + new Date().toLocaleTimeString("ko-KR");
        };
      })();
    </script>
  </body>
</html>
