<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <!-- 스펙 §6.11. 원인 문구에는 서브프로세스 stderr가 들어오므로 글자로만 넣는 것(textContent)이 첫 겹이고
         이것이 둘째 겹이다: 이 파일의 인라인 스크립트·스타일 **하나씩만** 해시로 허용하고, 그 밖의 스크립트
         (주입된 onerror= 같은 인라인 핸들러 포함)·원격 자원·이미지·폼 전송은 전부 막는다. 스크립트나
         스타일을 한 글자라도 고치면 해시를 다시 계산해야 한다 — tests/shell-html.test.ts가 어긋남을 잡는다.
         임베더가 실행하는 스크립트(main의 executeJavaScript)는 script-src를 거치지 않는다고 본다 — headless
         Chrome에서 CDP Runtime.evaluate로 이 정책 아래 렌더를 확인했고, Electron에서의 확인은 packaged 점검 몫이다. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-JFWV4QLIr0ySLmNq+RAfLMwZvt12qeRzAxhqLHmP9vw='; style-src 'sha256-Qz7cNLlq1WfuHKTT5usxWJ+qEcq7LfPxuxtRCjG3mdU='; base-uri 'none'; form-action 'none'" />
    <title>담화</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; height: 100vh;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 12px;
        font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
        background: #fbfbfa; color: #1c1b1a;
      }
      @media (prefers-color-scheme: dark) { body { background: #191817; color: #e8e6e3; } }
      h1 { font-size: 15px; font-weight: 600; margin: 0; }
      p { margin: 0; opacity: 0.72; max-width: 46ch; text-align: center; }
      /* 원인은 여러 줄이다 — zod 검증 실패는 `startup failed: [`부터 JSON 블록이 이어지고, 해결
         안내가 그 아래 붙는다. Phase 1은 한 줄을 가정해 가로 스크롤 한 줄로 보였다. 줄바꿈을 살리고
         긴 줄은 접되, 창을 다 먹지 않게 높이를 묶는다 — 전문은 로그 파일에 있다. */
      pre {
        margin: 0; padding: 10px 12px; width: min(70ch, calc(100vw - 48px));
        font-size: 12px; border-radius: 6px;
        background: rgba(127, 127, 127, 0.12);
        white-space: pre-wrap; overflow-wrap: anywhere;
        max-height: calc(24lh + 20px); overflow-y: auto;
      }
      .hint { font-size: 12px; opacity: 0.56; }
    </style>
  </head>
  <body>
    <h1 id="headline">담화를 준비하고 있어요</h1>
    <p id="body"></p>
    <pre id="detail" hidden></pre>
    <p class="hint" id="hint" hidden></p>
    <script>
      const q = new URLSearchParams(location.search);
      const state = q.get("state") ?? "starting";
      const copy = {
        starting: ["담화를 준비하고 있어요", "서비스가 뜨기를 기다리고 있어요."],
        quitting: [
          "담화를 종료하고 있어요",
          "진행 중인 작업을 안전한 지점까지 마무리하는 중이에요. 몇 분이 걸릴 수 있어요 — 그동안 강제 종료하지 말아 주세요.",
        ],
        // 앱이 `docker compose up -d`로 Postgres를 직접 띄운다 (Phase 2). 터미널 명령을 안내하면
        // 거짓이다. 이 상태는 원인이 Docker 데몬일 때만 온다 (status-view.ts의 shellStatusFrom, P2-C7) —
        // DOCKER_BIN이 틀린 것 같은 다른 postgres 실패는 failed 화면으로 가고, 거기서는 해결 줄이 말한다.
        "db-unreachable": [
          "데이터베이스에 연결할 수 없어요",
          "앱이 Docker로 데이터베이스를 직접 띄워요. Docker Desktop이 실행 중인지 확인해 주세요.",
        ],
        failed: ["담화를 시작하지 못했어요", "아래 내용이 원인이에요."],
      };
      const entry = Object.prototype.hasOwnProperty.call(copy, state) ? copy[state] : copy.failed;
      const [headline, body] = entry;
      document.getElementById("headline").textContent = headline;
      document.getElementById("body").textContent = body;

      const detail = q.get("detail");
      if (detail) {
        const el = document.getElementById("detail");
        el.textContent = detail;
        el.hidden = false;
      }

      const parts = [];
      const retry = q.get("retryInSeconds");
      if (retry) parts.push(`${retry}초 뒤에 다시 시도해요.`);
      const log = q.get("logPath");
      if (log) parts.push(`로그: ${log}`);
      // 종료 중에는 재시도 안내를 붙이지 않는다. 지금 할 일은 기다리는 것뿐이고, 그 줄은
      // 사람을 메뉴로 보내 방금 시작한 종료를 방해하게 만든다.
      if (state !== "quitting") parts.push("메뉴의 서비스 > 다시 시도로 지금 재시도할 수 있어요.");
      const hint = document.getElementById("hint");
      hint.textContent = parts.join(" ");
      hint.hidden = false;
    </script>
  </body>
</html>
