# Damwha self-hosted install — Postgres + API/SPA in Docker, ML worker on the host.
# Both this file and the host worker read the `.env` next to it (compose for
# ${...} substitution, the worker via pydantic-settings). See README.md.
#
# The project name is pinned so it does not change with the folder this file sits
# in — a repo clone would derive `deploy`, an unpacked tarball `damwha`, and the
# latter collides with the dev stack in be/docker-compose.yml (`name: damwha`).
# Pinned, the volume is always `damwha-deploy_pgdata`. Changing this name orphans
# that volume, exactly as the comment in be/docker-compose.yml warns.
name: damwha-deploy

services:
  postgres:
    image: ghcr.io/yjason-k/damwha-postgres:${DAMWHA_VERSION}
    container_name: damwha-deploy-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: damwha
    ports:
      # Host-side ports are deliberately not the service defaults: 5432 and 3000
      # are what the dev stack (be/docker-compose.yml) and `pnpm dev` already use,
      # so a clone of this repo would refuse to start. Override in .env if these
      # are taken too — and keep DATABASE_URL's port in step with the first one.
      - "${DAMWHA_DB_PORT:-15432}:5432"    # the host worker connects here (DATABASE_URL in .env)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d damwha"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    image: ghcr.io/yjason-k/damwha-api:${DAMWHA_VERSION}
    container_name: damwha-deploy-api
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${DAMWHA_API_PORT:-13000}:3000"   # UI + API + Swagger (/docs)
    environment:
      # Inside the compose network Postgres is `postgres`, not localhost —
      # this deliberately differs from the DATABASE_URL the host worker reads.
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/damwha
      STORAGE_ROOT: ./storage
      # The embed service runs on the host (needs the ML venv), so from the
      # container it is not loopback — opt in explicitly.
      EMBED_SERVICE_URL: http://host.docker.internal:8100
      EMBED_SERVICE_ALLOW_NON_LOOPBACK: "true"
      # The machine spec shown in the UI belongs to the host the worker runs on,
      # not this Linux container. Without the first two the API refuses every gpu
      # preset; without the other two `os.totalmem()` reports Docker Desktop's VM
      # allocation and `sysctl` is absent, so the spec card shows the container.
      # The `:-` fallbacks keep compose quiet when .env has not been filled in.
      CAPABILITIES_PLATFORM: darwin
      CAPABILITIES_ARCH: arm64
      CAPABILITIES_MEMORY_GB: ${CAPABILITIES_MEMORY_GB:-}
      CAPABILITIES_CHIP: ${CAPABILITIES_CHIP:-}
      # Stamped into every job payload; must equal what the worker's .env says.
      LENS_LLM_MODEL: ${LENS_LLM_MODEL}
      SUMMARY_LLM_MODEL: ${SUMMARY_LLM_MODEL}
    volumes:
      # Same directory the host worker uses as STORAGE_ROOT=./storage
      - ./storage:/repo/be/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  pgdata:
